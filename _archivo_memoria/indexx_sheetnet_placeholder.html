<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SheetNet Pro - Visualizador de Conexiones</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    /* Estilos generales */
    body {
      margin: 0; padding: 0;
      background-color: #121212;
      color: #e0e0e0;
      font-family: 'Poppins', sans-serif;
      display: flex; flex-direction: column; min-height: 100vh;
    }
    header {
      background-color: #1f2937;
      padding: 20px;
      text-align: center;
      font-weight: 600;
      font-size: 1.8rem;
      color: #4ade80; /* verde suave */
      box-shadow: 0 2px 5px rgba(0,0,0,0.5);
    }
    main {
      flex-grow: 1;
      padding: 20px;
      max-width: 900px;
      margin: 0 auto;
    }
    label {
      font-weight: 600;
      margin-bottom: 6px;
      display: block;
      color: #a5b4fc; /* azul pastel */
    }
    textarea {
      width: 100%;
      height: 120px;
      background-color: #1f2937;
      border: 2px solid #374151;
      border-radius: 12px;
      color: #d1d5db;
      padding: 12px;
      font-size: 1rem;
      resize: vertical;
      margin-bottom: 20px;
      transition: border-color 0.3s ease;
    }
    textarea:focus {
      border-color: #60a5fa; /* azul brillante */
      outline: none;
    }
    button {
      background-color: #2563eb; /* azul fuerte */
      color: white;
      border: none;
      padding: 14px 28px;
      font-size: 1.1rem;
      font-weight: 700;
      border-radius: 12px;
      cursor: pointer;
      transition: background-color 0.3s ease;
      box-shadow: 0 4px 10px rgba(37, 99, 235, 0.4);
      margin-top: 10px;
    }
    button:hover {
      background-color: #1d4ed8;
      box-shadow: 0 6px 14px rgba(29, 78, 216, 0.6);
    }
    footer {
      text-align: center;
      padding: 12px 0;
      background-color: #1f2937;
      color: #9ca3af;
      font-size: 0.9rem;
      box-shadow: 0 -2px 5px rgba(0,0,0,0.5);
    }
  </style>
</head>
<body>
  <header>
    SheetNet Pro — Visualizador Profesional de Conexiones
  </header>
  <main>
    <label for="masterLinks">📂 Bases Maestras (pega aquí los enlaces separados por salto de línea):</label>
    <textarea id="masterLinks" placeholder="https://docs.google.com/spreadsheets/d/xxxxxxxxxxxx/edit"></textarea>

    <label for="childLinks">📄 Bases Hijas (enlaces separados por salto de línea):</label>
    <textarea id="childLinks" placeholder="https://docs.google.com/spreadsheets/d/yyyyyyyyyyyy/edit"></textarea>

    <button id="scanBtn">🚀 Escanear conexiones</button>

    <div id="status" style="margin-top: 20px; font-weight: 600; color: #60a5fa;"></div>
  </main>
  <footer>
    Desarrollado por Andrick Hernández + ChatGPT + Luis Gaspar — SheetNet Pro Premium Edition
  </footer>

  <script>
    const scanBtn = document.getElementById('scanBtn');
    const statusDiv = document.getElementById('status');

    scanBtn.addEventListener('click', () => {
      const masters = document.getElementById('masterLinks').value.trim();
      const childs = document.getElementById('childLinks').value.trim();

      if (!masters && !childs) {
        statusDiv.textContent = '❗ Por favor ingresa al menos un enlace en alguna de las áreas.';
        statusDiv.style.color = '#f87171'; // rojo claro
        return;
      }

      statusDiv.style.color = '#60a5fa'; // azul
      statusDiv.textContent = '🔄 Simulando escaneo...';

      // Aquí se integraría llamada a API o función que analice enlaces,
      // mientras tanto, solo simulamos un delay y respuesta:
      setTimeout(() => {
        statusDiv.textContent = '✅ Escaneo simulado completado. Próximamente funcionalidad real.';
      }, 2000);
    });
  </script>
</body>
</html>
